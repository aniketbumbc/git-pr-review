services:
  backend:
    build:
      context: ./back-end
    container_name: "pr-review-api"
    env_file:
      - ./back-end/.env
    expose:
      - "3000"                 # matches app.listen(3000) in back-end/index.js
    restart: unless-stopped
    networks:
      - default                # private to pr-review (becomes pr-review_default)
      - web                    # only so Caddy can proxy to it

  frontend:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.autoreviewpr.com
    container_name: "pr-review-client"
    environment:
      - HOSTNAME=0.0.0.0       # Next.js standalone (node server.js) binds to this — must be 0.0.0.0, not the container IP
      - PORT=3000              # keep standalone on 3000
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - web

networks:
  web:
    external: true